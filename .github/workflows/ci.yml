# .github/workflows/ci.yml
name: OmniCost Enterprise Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: TypeScript Type Check
      run: npx tsc --noEmit

    - name: Run Unit Tests (Vitest)
      run: npx vitest run

    - name: Build Production Assets
      run: npm run build

    - name: Verify Docker Build
      run: docker build -t omnicost:latest .